<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apoderados — Asamblea RPH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-pagina="apoderados">
    <header class="barra">
      <p class="eyebrow">Asamblea &middot; RPH</p>
      <div class="barra-fin">
        <span class="usuario" id="usuarioActivo"></span>
        <button type="button" class="btn-texto" id="btnSalir">
          Cerrar sesión
        </button>
      </div>
    </header>

    <div class="marco">
      <nav class="lateral" aria-label="Secciones">
        <a class="lateral-item" href="dashboard.html">Asistencia</a>
        <a class="lateral-item" href="apoderados.html" aria-current="page"
          >Apoderados</a
        >
        <a class="lateral-item" href="preguntas.html">Preguntas</a>
        <a class="lateral-item" href="reporte.html">Reporte</a>
      </nav>

      <main class="vista">
        <h1>Apoderados</h1>
        <p class="sub">
          Registra quién entra en representación de cada propietario. El
          apoderado ingresa con su cédula como usuario y como contraseña.
        </p>

        <section class="panel">
          <p class="eyebrow" id="tituloFormulario">Nuevo apoderado</p>

          <div class="campo">
            <label for="propietario">Propietario que representa</label>
            <select id="propietario"></select>
          </div>

          <div class="campo">
            <label for="cedula">Cédula del apoderado</label>
            <input
              type="text"
              id="cedula"
              placeholder="1128048694"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
            />
          </div>

          <div class="campo">
            <label for="nombre">Nombre del apoderado</label>
            <input
              type="text"
              id="nombre"
              placeholder="Nombre completo"
              autocomplete="off"
            />
          </div>

          <p class="error" id="errorApoderado" hidden></p>
          <p class="guardado" id="notaApoderado" hidden></p>

          <div class="acciones">
            <button type="button" class="btn btn-auto" id="btnGuardar">
              Guardar apoderado
            </button>
            <button type="button" class="btn-texto" id="btnCancelar" hidden>
              Cancelar edición
            </button>
          </div>
        </section>

        <div class="herramientas">
          <input
            type="search"
            id="buscador"
            placeholder="Buscar por propietario, inmueble o cédula"
            autocomplete="off"
          />
          <label class="check">
            <input type="checkbox" id="soloConApoderado" />
            Solo con apoderado
          </label>
          <span class="conteo" id="conteoLista"></span>
        </div>

        <div class="lista" id="lista"></div>
      </main>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="apoderados.js"></script>
  </body>
</html>
