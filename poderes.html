<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poderes — Asamblea RPH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-pagina="poderes">
    <header class="barra">
      <p class="eyebrow">Asamblea &middot; RPH</p>
      <div class="barra-fin">
        <span class="usuario" id="usuarioActivo"></span>
        <button type="button" class="btn-texto" id="btnSalir">
          Cerrar sesión
        </button>
      </div>
    </header>

    <div class="marco">
      <nav class="lateral" aria-label="Secciones">
        <a class="lateral-item" href="dashboard.html">Asistencia</a>
        <a class="lateral-item" href="propietarios.html">Propietarios</a>
        <a class="lateral-item" href="apoderados.html">Apoderados</a>
        <a class="lateral-item" href="preguntas.html">Preguntas</a>
        <a class="lateral-item" href="reporte.html">Reporte</a>
        
        <a class="lateral-item" href="poderes.html" aria-current="page">Poderes</a>
      </nav>

      <main class="vista">
        <h1>Poderes por inmueble</h1>
        <p class="sub">
          Cuando un propietario reparte el poder entre varias personas, aquí se
          separan sus inmuebles para que cada apoderado vote solo por los suyos.
        </p>

        <section class="panel">
          <p class="eyebrow" id="tituloFormulario">Otorgar poder</p>

          <div class="campo">
            <label for="propietario">Propietario que otorga</label>
            <select id="propietario"></select>
          </div>

          <div class="campo">
            <label>Inmuebles que entrega</label>
            <div class="inmuebles-check" id="inmuebles">
              <p class="ayuda">Elige primero un propietario.</p>
            </div>
          </div>

          <div class="campo">
            <label for="cedula">Cédula del apoderado</label>
            <input
              type="text"
              id="cedula"
              placeholder="73183949"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
            />
          </div>

          <div class="campo">
            <label for="nombre">Nombre del apoderado</label>
            <input
              type="text"
              id="nombre"
              placeholder="Nombre completo"
              autocomplete="off"
            />
          </div>

          <p class="error" id="errorPoder" hidden></p>
          <p class="guardado" id="notaPoder" hidden></p>

          <div class="acciones">
            <button type="button" class="btn btn-auto" id="btnOtorgar">
              Otorgar poder
            </button>
          </div>
        </section>

        <div class="herramientas">
          <span class="conteo" id="conteoLista"></span>
        </div>

        <div class="lista" id="lista"></div>
      </main>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="poderes.js"></script>
  </body>
</html>
