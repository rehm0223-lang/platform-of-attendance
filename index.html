<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar — Asamblea RPH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-pagina="login">
    <main class="login">
      <section class="tarjeta">
        <p class="eyebrow">Asamblea &middot; RPH</p>
        <h1>Control de asistencia</h1>
        <p class="sub">Ingresa con tu usuario para continuar.</p>

        <div class="campo">
          <label for="user">Usuario</label>
          <input
            type="text"
            id="user"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
          />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
          />
        </div>

        <p class="error" id="error" role="alert" hidden></p>

        <button type="button" class="btn" id="btnIngresar">Ingresar</button>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
